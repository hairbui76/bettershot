[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/render", "crates/capture", "crates/app"]

[workspace.package]
# Bumped by release-please; see release-please-config.json.
version = "0.4.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
authors = ["bettershot contributors"]
description = "Modern cross-platform screenshot capture and annotation."
homepage = "https://github.com/bettershot/bettershot"
repository = "https://github.com/bettershot/bettershot"
license = "MPL-2.0"

[workspace.dependencies]
bettershot-core = { path = "crates/core", version = "0.4.0" } # x-release-please-version
bettershot-cli = { path = "crates/cli", version = "0.4.0" } # x-release-please-version
bettershot-capture = { path = "crates/capture", version = "0.4.0" } # x-release-please-version
bettershot-render = { path = "crates/render", version = "0.4.0" } # x-release-please-version

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
directories = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The `Satty/` directory is a read-only upstream reference checkout, not a member
# of this workspace. Never build or modify it from here.
[workspace.metadata]
reference-checkouts = ["Satty"]

# Release artefacts, built by `cargo dist`.
#
# This produces unsigned archives and installers. Signing (an Authenticode
# certificate on Windows, notarization on macOS) and the winget / Homebrew
# submissions are separate steps that need credentials this repository does not
# and should not hold — see ROADMAP.md.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
install-updater = false
# The tray needs GTK 3 on Linux; distribution builds should include it.
features = ["tray"]

[workspace.metadata.dist.dependencies.apt]
libxkbcommon-dev = "*"
libwayland-dev = "*"
libxcb1-dev = "*"
libxcb-randr0-dev = "*"
libdbus-1-dev = "*"
libgtk-3-dev = "*"
libayatana-appindicator3-dev = "*"
