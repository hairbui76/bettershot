name: Release Please

# Version bumps, changelog and releases, driven by the commit history.
#
# Every commit in this repository follows Conventional Commits, which is what
# release-please reads: `feat:` bumps the minor, `fix:` the patch, and the
# changelog is assembled from the messages rather than written by hand.
#
# How it runs: this opens (and keeps updating) a release pull request. Merging
# that PR is what actually cuts the release — it tags the commit, creates the
# GitHub release, and the job below attaches the binaries.
#
# Three things here are deliberate and easy to get wrong if edited:
#
#   * `release-type: simple`, not `rust`. The rust strategy assumes the root
#     Cargo.toml is a *package* manifest; ours is a virtual workspace whose
#     version lives under `[workspace.package]`, and the rust updater throws on
#     a manifest with no `[package]`. The version lines are annotated with
#     `x-release-please-version` instead — including the four
#     `[workspace.dependencies]` pins, which are `^0.1.0` requirements that
#     stop resolving the moment the workspace version moves past them.
#   * The release is a **draft**. The artefacts are unsigned: the Windows
#     installer has no Authenticode signature and the macOS build is not
#     notarized. They are fine to download and test, and must not be published
#     as though they were.
#   * The artefacts are built *in this workflow*. A tag pushed with the default
#     `GITHUB_TOKEN` does not trigger other workflows, so `release.yml` would
#     never fire for a release cut here and the release would have no binaries.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v5
        if: ${{ steps.release.outputs.prs != '' }}
        with:
          fetch-depth: 0

      # A version bump changes five lines of Cargo.lock, and release-please
      # only edits the files it is told about. Leaving the lockfile stale
      # breaks anything building with `--locked` or `--frozen` — which is
      # exactly what the AUR package does.
      - name: Keep Cargo.lock in step with the release PR
        if: ${{ steps.release.outputs.prs != '' }}
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          branch=$(echo "$PRS" | jq -r '.[0].headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "No release branch in the action output; nothing to sync."
            exit 0
          fi
          echo "syncing the lockfile on $branch"
          git fetch origin "$branch"
          git checkout "$branch"
          # Resolving the workspace rewrites Cargo.lock with the new versions.
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already matches the bump."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock with the version bump"
          git push origin "$branch"

  # Only runs on the push that merges the release PR.
  artifacts:
    name: Attach ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdbus-1-dev pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build
        run: cargo build --release -p bettershot --features tray --target ${{ matrix.target }}

      - name: Stage the archive
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          staging="bettershot-${TAG}-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/bettershot.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/bettershot" "$staging/"
          fi
          cp LICENSE README.md "$staging/"

          # build.rs emits the manpage and shell completions into OUT_DIR.
          out=$(find "target/${{ matrix.target }}/release/build" -name 'bettershot.1' -print -quit || true)
          if [ -n "$out" ]; then
            cp "$out" "$staging/" || true
            cp -r "$(dirname "$out")/completions" "$staging/" || true
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$staging.zip" "$staging"
          else
            tar czf "$staging.tar.gz" "$staging"
          fi

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" bettershot-*.tar.gz bettershot-*.zip --clobber
