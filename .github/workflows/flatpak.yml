name: Flatpak

# Build the Flatpak so the manifest stops being a guess.
#
# This does NOT publish anything: Flathub submission is a pull request against
# flathub/flathub with an account this repository does not have. What it does
# remove is the risk that the manifest is quietly wrong — a wrong runtime
# version, a bad checksum, a missing build dependency — which is otherwise only
# discovered by whoever first tries to ship it.
#
# Deliberately not part of `CI`: it downloads a ~1 GB runtime and does a full
# offline release build inside the sandbox, so it runs only when something it
# depends on changes, or on request.

on:
  push:
    paths:
      - 'packaging/flatpak/**'
      - 'assets/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flatpak/**'
      - 'assets/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

# The runtime the manifest targets. Keep this in step with `runtime-version`
# in packaging/flatpak/org.bettershot.Bettershot.yml — the manifest is what
# Flathub reads, this is only what CI installs.
env:
  RUNTIME_VERSION: '25.08'

jobs:
  build:
    name: Build the Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # aiohttp and tomlkit are what flatpak-cargo-generator.py imports.
          sudo apt-get install -y flatpak flatpak-builder python3-aiohttp python3-tomlkit

      # --user throughout: no root, and the runtime cache is a plain directory.
      - name: Add flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      # Which runtime to target is a real decision, not a formality: the Rust
      # in the SDK extension has to be new enough for the dependency tree, and
      # 24.08 ships 1.89 while egui needs 1.92. Printed on every run so the
      # next person choosing a branch can see the options.
      - name: Available runtime branches
        run: |
          echo "--- org.freedesktop.Sdk.Extension.rust-stable ---"
          flatpak remote-ls --user flathub --all --columns=ref \
            | grep 'rust-stable' || true
          echo "--- org.freedesktop.Platform ---"
          flatpak remote-ls --user flathub --all --columns=ref \
            | grep '^runtime/org.freedesktop.Platform/x86_64' || true

      - name: Install the runtime
        run: |
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//${{ env.RUNTIME_VERSION }} \
            org.freedesktop.Sdk//${{ env.RUNTIME_VERSION }} \
            org.freedesktop.Sdk.Extension.rust-stable//${{ env.RUNTIME_VERSION }}
          echo "--- rustc in the SDK extension ---"
          flatpak run --user --command=sh \
            --devel org.freedesktop.Sdk//${{ env.RUNTIME_VERSION }} \
            -c '/usr/lib/sdk/rust-stable/bin/rustc --version' || true

      # Flathub builds are offline, so every crate has to be vendored into
      # cargo-sources.json first. The generator is maintained alongside
      # flatpak-builder rather than vendored here.
      - name: Vendor the crate sources
        run: |
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock \
            -o packaging/flatpak/cargo-sources.json
          echo "vendored $(python3 -c 'import json;print(len(json.load(open("packaging/flatpak/cargo-sources.json"))))') sources"

      - name: Build
        run: |
          cd packaging/flatpak
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build org.bettershot.Bettershot.yml

      # flatpak-builder reports an appstreamcli failure as a one-line summary
      # and points at a report it does not print. Re-run the compose by hand to
      # get the actual complaint.
      - name: AppStream compose report
        if: failure()
        run: |
          sudo apt-get install -y appstream
          cd packaging/flatpak
          echo "--- what is in the build result ---"
          find build/files/share \( -name '*.svg' -o -name '*.xml' \
            -o -name '*.desktop' -o -name '*.png' \) -printf '%s\t%p\n' || true
          echo "--- compose, with the full issue report ---"
          appstreamcli compose --no-net --print-report=full \
            --prefix=/ --origin=bettershot \
            --result-root=/tmp/as --data-dir=/tmp/as/data --icons-dir=/tmp/as/icons \
            build/files 2>&1 | tail -40 || true

      # A manifest can build and still install nothing useful, so check the
      # binary and the desktop metadata actually landed in the result.
      - name: Check what the build produced
        run: |
          cd packaging/flatpak
          test -x build/files/bin/bettershot \
            || { echo "no bettershot binary in the build result"; exit 1; }
          test -f build/files/share/applications/org.bettershot.Bettershot.desktop \
            || { echo "no .desktop file in the build result"; exit 1; }
          test -f build/files/share/metainfo/org.bettershot.Bettershot.metainfo.xml \
            || { echo "no AppStream metainfo in the build result"; exit 1; }
          echo "--- installed tree ---"
          find build/files -maxdepth 3 -type f | head -20
