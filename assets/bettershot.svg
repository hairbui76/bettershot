<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    bettershot application icon.

    The `<svg>` element is deliberately the first thing after the XML
    declaration, and every note lives inside it. Image loaders identify SVG by
    sniffing a short prefix of the file for the magic `<svg`; a description
    block above the element pushes it out of that window, and the file stops
    being recognised as an image at all. It is not a parse error — the XML is
    perfectly valid, which is what makes it confusing. This icon previously
    had a comment here that put `<svg` at byte 488, and appstreamcli rejected
    it with "Unrecognized image file format" while every XML tool read it
    happily.

    A camera shutter with a selection corner bracket over it: the two things
    the program does, capture and choose a region. Drawn as flat shapes with
    no gradients or filters so it stays legible at 16px in a system tray,
    which is where most icons of this kind fall apart.

    The palette matches the default annotation colours in
    crates/core/src/style.rs, so the icon and the tool agree with each other.
  -->
  <title>bettershot</title>

  <!-- Body -->
  <rect x="8" y="26" width="112" height="82" rx="14" fill="#2f3542"/>
  <!-- Viewfinder hump -->
  <path d="M44 26 L54 12 h20 l10 14 z" fill="#2f3542"/>

  <!-- Lens -->
  <circle cx="64" cy="68" r="30" fill="#3d4454"/>
  <circle cx="64" cy="68" r="22" fill="#22a6b3"/>
  <circle cx="64" cy="68" r="11" fill="#1b2430"/>
  <!-- Catchlight, so the lens reads as glass rather than a flat hole -->
  <circle cx="55" cy="59" r="5" fill="#ffffff" opacity="0.5"/>

  <!-- Shutter indicator -->
  <circle cx="103" cy="41" r="5" fill="#eb4d4b"/>

  <!-- Selection bracket, the "choose a region" half of the idea. Offset to the
       top-left so it reads as a marquee being dragged across the camera. -->
  <g fill="none" stroke="#f0932b" stroke-width="7" stroke-linecap="square">
    <path d="M6 44 V18 H32"/>
  </g>
</svg>
